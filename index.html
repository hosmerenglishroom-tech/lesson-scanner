<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px;
}
#scanner {
  width: 300px;
  margin: 20px auto;
}
button {
  padding: 10px 20px;
  margin-top: 10px;
}
.card {
  background: #f4f4f4;
  padding: 20px;
  border-radius: 10px;
  margin-top: 20px;
}
</style>
</head>

<body>

<h2>Lesson Scanner</h2>

<div id="scanner"></div>
<div id="result"></div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwBxxa129wz06jrnkdJZZjqs--8jiD6ZA9z0tjcI0nuWMDEvGgBptvaoaRaObBB5QuH/exec";

let html5QrCode = new Html5Qrcode("scanner");

html5QrCode.start(
  { facingMode: "environment" },
  { fps: 10, qrbox: 250 },
  onScanSuccess
);

function onScanSuccess(decodedText) {

  html5QrCode.stop();

  fetch(API_URL + "?action=preview&key=" + encodeURIComponent(decodedText))
    .then(res => res.json())
    .then(data => {

      if (data.error) {
        document.getElementById("result").innerHTML =
          "<div class='card'>Error: " + data.error + "</div>";
        return;
      }

      document.getElementById("result").innerHTML = `
        <div class="card">
          <strong>Student:</strong> ${data.studentName}<br>
          <strong>Ticket:</strong> ${data.ticketId}<br>
          <strong>Remaining:</strong> ${data.remaining}<br><br>
          <button onclick="confirmLesson('${encodeURIComponent(decodedText)}')">
            Confirm Lesson
          </button>
        </div>
      `;
    })
    .catch(err => {
      document.getElementById("result").innerHTML =
        "<div class='card'>Fetch Error: " + err + "</div>";
    });
}

function confirmLesson(encodedKey) {

  const key = decodeURIComponent(encodedKey);

  fetch(API_URL + "?action=record&key=" + encodeURIComponent(key))
    .then(res => res.json())
    .then(data => {

      if (data.error) {
        document.getElementById("result").innerHTML =
          "<div class='card'>Error: " + data.error + "</div>";
        return;
      }

      document.getElementById("result").innerHTML = `
        <div class="card">
          <strong>Lesson Recorded</strong><br>
          Remaining: ${data.remaining}
        </div>
      `;

      setTimeout(() => {
        location.reload();
      }, 2000);
    })
    .catch(err => {
      document.getElementById("result").innerHTML =
        "<div class='card'>Fetch Error: " + err + "</div>";
    });
}

</script>

</body>
</html>
